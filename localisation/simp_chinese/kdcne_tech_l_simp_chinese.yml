l_simp_chinese:
 # KDC 纳米机制扩展 · 一次性科技（占位文本，后续补正式文本）
 tech_kdcne_evolution_core:0 "纳米进化：杀敌升级强化"
 tech_kdcne_evolution_core_desc:0 "纳米舰杀敌累计，每5杀升1级，每级+5%武器伤害+3%船体（封顶+100%/+60%），濒死可消耗杀敌数回血。"
 tech_kdcne_nano_corrosion:0 "纳米侵蚀：火力与机动压制"
 tech_kdcne_nano_corrosion_desc:0 "命中留下纳米云；敌舰在云内逐日累积侵蚀，削弱伤害、航速、装甲、护盾、闪避和双穿。离云后侵蚀逐渐消退。"
 tech_kdcne_nano_cloud:0 "纳米云：区域压制"
 tech_kdcne_nano_cloud_desc:0 "解锁纳米云发生器与纳米舰载机，使载舰造成伤害时也能播撒固定位置的纳米云。"
 tech_kdcne_assimilation:0 "纳米同化：持续暴露夺舰"
 tech_kdcne_assimilation_desc:0 "解锁纳米云控制窗口中的夺舰开关。累计暴露30日的合规普通敌舰可被同化：复制设计生成我方舰船，再移除原船，不继承事件身份与临时状态。"
 tech_kdcne_lifesteal:0 "纳米吸血：命中回血"
 tech_kdcne_lifesteal_desc:0 "纳米武器命中按伤害比例回复船体/护甲。"
 tech_kdcne_system_nanofication:0 "星系纳米化：批量转化行星"
 tech_kdcne_system_nanofication_desc:0 "巨构完工后，把本星系符合条件的未殖民自然岩质星球转化为纳米星球，保留殖民地、异常和遗迹。"
 tech_kdcne_nano_starcage:0 "星笼世界：恒星造宜居巨构"
 tech_kdcne_nano_starcage_desc:0 "已停用的旧科技，保留已有存档的科技记录，不再开放星笼世界建造。"
