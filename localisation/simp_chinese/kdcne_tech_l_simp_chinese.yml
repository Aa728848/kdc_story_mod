 tech_kdcne_evolution_core_effect:0 "解锁纳米进化核心和纳米进化实验室。"
 tech_kdcne_nano_corrosion_effect:0 "解锁纳米侵蚀鱼雷。"
 tech_kdcne_nano_cloud_effect:0 "解锁纳米云发生器、纳米舰载机和行星防护设施。"
 tech_kdcne_assimilation_effect:0 "允许开启长期暴露同化；默认关闭，不再使用击毁夺舰概率。"
 tech_kdcne_lifesteal_effect:0 "装备纳米鱼雷的载舰获得吸血能力。"
 tech_kdcne_system_nanofication_effect:0 "解锁星系纳米化巨构、纳米恒星船坞与纳米云投射阵列。"
 tech_kdcne_nano_starcage_effect:0 "旧存档兼容定义；星笼建造已停用。"
