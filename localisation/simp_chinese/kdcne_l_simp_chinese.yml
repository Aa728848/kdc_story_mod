 mod_kdcne_nano_lifesteal:0 "$kdcne_nano_lifesteal$"
 kdcne_nano_corrosion_debuff_desc:0 "每层：伤害-5%、航速-4%、装甲与护盾上限-5%、闪避-3个百分点、双穿乘数-5%；20层封顶。脱离云区约2天后每天消退1个暴露日。累计30个有效暴露日可尝试同化。"

 NAME_kdcne_test_capture_dummy:0 "夺舰测试靶舰"
 kdcne_test.5.title:0 "【测试】召唤夺舰靶舰"
 kdcne_test.5.desc:0 "已在所选己方舰队附近生成无武器的敌对护卫舰，无需宣战。测试国与舰队带专用标记，可测试长期暴露同化。请在纳米云控制窗口开启同化，持续覆盖30个有效暴露日。低耐久目标可能提前被击毁，建议改用 event kdcne_test.6。"
