l_simp_chinese:
 kdcne_cloud_anchor:0 "纳米云"
 kdcne_cloud_anchor_tooltip:0 "纳米云：固定云区"
 kdcne_cloud_anchor_desc:0 "来源国以外的舰船在云区内逐日累积纳米侵蚀，不要求宣战、接触或调查。小云有效半径30；远程投射覆盖整个星系。可见云雾不精确表示判定边界。"
 NAME_kdcne_assimilated_fleet:0 "纳米同化舰队"
 kdcne_projection_coverage:0 "纳米云全域覆盖"
 kdcne_projection_coverage_desc:0 "最新投射方以外的舰船在本星系逐日累积纳米侵蚀，和平或友好目标同样受影响，无需宣战、接触或调查。覆盖360天，再次投射重新计时。结束后减益逐日消退；抗性与免疫仍有效。"
 sc_kdcne_nano:0 "纳米恒星"
 pc_kdcne_nano_star:0 "纳米恒星"
 pc_kdcne_nano_star_desc:0 "旧版本中由纳米网络改造的恒星。现已停用恒星转化和新建纳米星笼，已有天体保留。纳米云覆盖期限与天体是否存在分别计算。"
 kdcne_mega_cloud_projector:0 "纳米云投射阵列"
 kdcne_mega_cloud_projector_DESC:0 "从巨构升级入口打开投射控制台。每次投射消耗10000能量、2000纳米，所有阵列共用30天帝国冷却。"
 kdcne_mega_cloud_projector_MEGASTRUCTURE_DETAILS:0 "向目标星系投送持续360天的纳米云覆盖，使来源国以外的舰船逐日积累侵蚀。不改变恒星和其他天体。"
 edict_kdcne_cloud_control:0 "纳米云控制"
 edict_kdcne_cloud_control_desc:0 "切换纳米云长期暴露同化。近距离云区和巨构远程覆盖共用此开关；远程发射请从投射阵列本身进入。"
 kdcne_cloud.20.title:0 "纳米云控制"
 kdcne_cloud.20.desc:0 "§R实验彩蛋：开启夺舰可能造成兼容性 BUG，以及不可预测的事件链中断。仅建议在实在难以继续游戏时自行启用。§!\n\n夺舰默认关闭；关闭时纳米云仍正常施加侵蚀减益。开启并掌握同化科技后，累计30个有效暴露日的外来舰船可进入同化流程。\n\n同化通过复制设计生成我方舰船，再移除原船，不保留原船的事件身份、经验与临时修正。特殊剧情舰船、领袖或空间站可能因此出现异常；复制失败时保留原目标，空间站同化不接管星系或行星。\n\n此开关同时影响命中云与远程覆盖。云区持续侵蚀来源国以外的舰船，包括和平、友好和未接触目标；己方拥有或控制的舰船不受影响。"
 kdcne_capture_off:0 "[ ] 长期暴露夺舰：关闭（点击开启）"
 kdcne_capture_on:0 "[√] 长期暴露夺舰：开启（点击关闭）"
 kdcne_lock_target:0 "锁定星系"
 kdcne_review_projection:0 "纳米云覆盖"
 kdcne_close:0 "关闭面板"
 kdcne_back:0 "返回投射控制台"
 kdcne_cloud.21.title:0 "纳米云投射控制台"
 kdcne_cloud.21.desc:0 "在地图点选目标星系的恒星、舰队或基地，点击“锁定星系”，再确认纳米云覆盖。每次消耗10000能量、2000纳米，覆盖整个星系360天；所有阵列共用30天冷却。\n\n投射不改变天体，来源国以外的舰船在覆盖区内逐日积累侵蚀。无需宣战、接触或调查；可见云雾不表示完整覆盖边界。"
 kdcne_fire_projection:0 "确认云覆盖（10000能量、2000纳米）"
 kdcne_cloud.22.title:0 "当前无法投射"
 kdcne_cloud.22.desc:0 "目标、阵列、资源或冷却状态发生变化，本次未扣费。请返回查看确认按钮的条件；如果阵列连接已失效，请关闭面板后从巨构重新打开。"
 kdcne_test_capture_endurance:0 "同化测试：高耐久"
 kdcne_test_capture_endurance_desc:0 "测试用额外船体、装甲和护盾；通过修正加血，保留原版护卫舰船型以测试同化。"

 kdcne_test.6.title:0 "【测试】高耐久同化靶舰"
 kdcne_test.6.desc:0 "已在所选己方舰队附近生成高耐久敌对护卫舰，无需宣战。额外增加100万船体、装甲和护盾，不携带武器。测试国与舰队的专用标记保留其同化资格。开启纳米云同化并持续覆盖30个有效暴露日后，生成同设计我方舰船；测试耐久修正不会复制。选中己方舰队运行 event kdcne_test.3，可清理其所在星系尚属测试国的靶舰。"
 kdcne_mega_cloud_projector_control:0 "打开投射控制台"
 kdcne_mega_cloud_projector_control_DESC:0 "免费打开投射控制台。解除暂停，操作自然完成后再等待1天。关闭或发射后可再次从本巨构操作，无需恢复原型号。"
 kdcne_clear_target:0 "清除目标"
 kdcne_target_empty:0 "尚未锁定星系"
 kdcne_target_selected:0 "目标已锁定（悬停查看名称）"
 kdcne_target_name:0 "当前锁定星系：§Y[This.GetName]§!。"
 kdcne_cloud.23.title:0 "确认纳米云投射"
 kdcne_cloud.23.desc:0 "目标星系：§Y[event_target:kdcne_projection_selected.GetName]§!。费用：10000能量、2000纳米，共用30天冷却。全星系覆盖360天，不改变天体；影响最新投射方以外的舰船，包括和平和友好目标，无需调查。"
 kdcne_cloud.23.no_target:0 "目标已经清除或消失，请返回投射控制台重新锁定。"
 kdcne_requires_spatial_selection:0 "已在地图选中可定位到星系的恒星、舰队或基地。"
 kdcne_launcher_bound:0 "已绑定本次打开的发射阵列；若未通过，请关闭窗口后从阵列重新打开。"
 kdcne_launcher_ready:0 "绑定的阵列已建成，且当前没有正在进行的升级。"
 kdcne_launcher_owned:0 "绑定的阵列仍属于我方。"
 kdcne_launcher_controlled:0 "绑定的阵列所在星系仍由我方控制。"
 kdcne_requires_launcher:0 "必须仍拥有并控制本次打开的已建成纳米云投射阵列。"
 kdcne_requires_target:0 "已锁定目标星系。"
 kdcne_requires_projection_ready:0 "30天帝国共用发射冷却已结束；剩余时间见帝国修正“纳米云阵列充能”。"
 kdcne_projection_recharging:0 "纳米云阵列充能"
 kdcne_projection_recharging_desc:0 "上次投射后，所有纳米云阵列共同充能30天。期间无法再次启动投射操作或确认发射。"
 kdcne_requires_no_projection_window:0 "请等待阵列操作完成，并先关闭已打开的投射控制台或确认窗口。"
 kdcne_requires_star:0 "目标星系存在可转化的主天体。"
 kdcne_requires_unprotected_system:0 "目标不在原版特殊星系保护名单中，且无投射保护标记。"
 kdcne_requires_no_coverage:0 "目标没有尚未到期的纳米云投射覆盖。"
 kdcne_requires_target_owner:0 "目标为我方/无主星系，或其领土所有者正与我方交战。"
 kdcne_requires_unprotected_star:0 "目标主天体没有异常、考古遗迹或投射保护标记。"
 kdcne_requires_free_stellar_orbit:0 "目标恒星轨道没有冲突巨构。"
 kdcne_requires_ready_projector:0 "本星系必须有我方已建成的纳米云投射阵列。"
 kdcne_cloud.26.title:0 "阵列连接未建立"
 kdcne_cloud.26.desc:0 "本次操作的阵列已不存在、归属变化或尚未完成。请关闭旧面板，从现有阵列重新操作。若旧阵列显示空名称，可另存后执行 event kdcne_cloud.25 修复。"
 kdcne_cloud.25.title:0 "旧阵列维护"
 kdcne_cloud.25.desc:0 "仅替换带有本扩展建成标记、归属于我方、关联天体仍存在且型号异常的旧阵列。正常阵列和两个控制阶段均保留。替换后实例编号会变化，建议先另存。维护完成后请从巨构重新打开控制台。"
 kdcne_repair_projectors:0 "修复符合条件的旧阵列"

